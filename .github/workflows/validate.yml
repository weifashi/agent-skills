# 本地跑同样的命令：python3 scripts/validate.py
name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py
      - run: python3 -m unittest discover -s tests -p '*_test.py'
